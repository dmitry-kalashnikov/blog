<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра Шляпа</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .screen {
            display: none;
            width: 90%;
            max-width: 450px;
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .screen.active {
            display: block;
        }
        h1, h2 { margin-top: 0; color: #2c3e50; }
        .setting-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
        }
        .word-display {
            font-size: 40px;
            font-weight: bold;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-wrap: break-word;
        }
        .game-controls {
            display: flex;
            gap: 10px;
        }
        .game-controls .btn { margin-top: 0; }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .team-score {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="screen-setup" class="screen active">
        <h1>Шляпа</h1>
        <div class="setting-group">
            <label>Количество команд:</label>
            <select id="set-teams">
                <option value="2">2 команды</option>
                <option value="3">3 команды</option>
                <option value="4">4 команды</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Игроков в команде:</label>
            <select id="set-players">
                <option value="2">2 человека</option>
                <option value="3">3 человека</option>
                <option value="4">4 человека</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Время на ход (сек):</label>
            <select id="set-time">
                <option value="30">30 секунд</option>
                <option value="45">45 секунд</option>
                <option value="60" selected>60 секунд</option>
                <option value="90">90 секунд</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Слов в шляпе (всего):</label>
            <input type="number" id="set-words" value="40" min="10" max="100">
        </div>
        <button class="btn btn-primary" onclick="initGame()">Начать игру</button>
    </div>

    <div id="screen-preturn" class="screen">
        <h2>Ходит: <span id="current-team-name" style="color:#3498db"></span></h2>
        <h3 style="color: #7f8c8d;">Объясняет: <span id="current-player-name"></span></h3>
        <p>Слов в шляпе: <span id="words-left-display"></span></p>
        <button class="btn btn-success" onclick="startTurn()">Поехали!</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="stats">
            <span>Счет хода: <span id="turn-score">0</span></span>
            <span>В шляпе: <span id="game-words-left"></span></span>
        </div>
        <div class="timer" id="timer-display">60</div>
        <div class="word-display" id="word-display">Загрузка...</div>
        <div class="game-controls">
            <button class="btn btn-danger" onclick="skipWord()">Сброс (-1)</button>
            <button class="btn btn-success" onclick="guessWord()">Угадал (+1)</button>
        </div>
    </div>

    <div id="screen-turn-result" class="screen">
        <h2>Время вышло!</h2>
        <p style="font-size: 18px;">За этот ход вы заработали: <strong id="turn-final-score"></strong> очков</p>
        <button class="btn btn-primary" onclick="nextTurn()">Следующий ход</button>
    </div>

    <div id="screen-final" class="screen">
        <h1>Конец игры!</h1>
        <p>Шляпа пуста.</p>
        <div id="final-scores" style="margin: 20px 0; text-align: left;"></div>
        <button class="btn btn-primary" onclick="location.reload()">Сыграть еще раз</button>
    </div>

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

            }
            hat = wordsCopy.slice(0, totalWords);

            // Создаем команды
            teams = [];
            let tNames = [...teamNamesDb];
            shuffle(tNames);
            let pNames = [...playerNamesDb];
            shuffle(pNames);

            for(let i=0; i<numTeams; i++) {
                let players = [];
                for(let j=0; j<numPlayers; j++) {
                    players.push(pNames.pop() || `Игрок ${j+1}`);
                }
                teams.push({
                    name: tNames[i] || `Команда ${i+1}`,
                    score: 0,
                    players: players,
                    currentPlayerIndex: 0
                });
            }

            currentTeamIndex = 0;
            prepareTurn();
        }

        function prepareTurn() {
            if (hat.length === 0) {
                endGame();
                return;
            }

            const team = teams[currentTeamIndex];
            const player = team.players[team.currentPlayerIndex];

            document.getElementById('current-team-name').innerText = team.name;
            document.getElementById('current-player-name').innerText = player;
            document.getElementById('words-left-display').innerText = hat.length;

            showScreen('screen-preturn');
        }

        function startTurn() {
            turnScore = 0;
            timeRemaining = turnTime;
            document.getElementById('turn-score').innerText = turnScore;
            document.getElementById('timer-display').innerText = timeRemaining;
            document.getElementById('game-words-left').innerText = hat.length;
            
            showScreen('screen-game');
            showNextWord();

            timerInterval = setInterval(() => {
                timeRemaining--;
                document.getElementById('timer-display').innerText = timeRemaining;
                if (timeRemaining <= 0) {
                    endTurn();
                }
            }, 1000);
        }

        function showNextWord() {
            if (hat.length === 0) {
                endTurn();
                return;
            }
            // Выбираем случайное слово из оставшихся
            currentWordIndex = Math.floor(Math.random() * hat.length);
            document.getElementById('word-display').innerText = hat[currentWordIndex];
            document.getElementById('game-words-left').innerText = hat.length;
        }

        function guessWord() {
            turnScore++;
            teams[currentTeamIndex].score++;
            document.getElementById('turn-score').innerText = turnScore;
            
            // Удаляем угаданное слово из шляпы
            hat.splice(currentWordIndex, 1);
            showNextWord();
        }

        function skipWord() {
            turnScore--;
            teams[currentTeamIndex].score--;
            document.getElementById('turn-score').innerText = turnScore;
            
            // Слово остается в шляпе, просто показываем другое
            showNextWord();
        }

        function playBeep() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function endTurn() {
            clearInterval(timerInterval);
            playBeep();
            
            document.getElementById('turn-final-score').innerText = turnScore;
            showScreen('screen-turn-result');

            // Сдвигаем индекс игрока для текущей команды (для следующего круга)
            let team = teams[currentTeamIndex];
            team.currentPlayerIndex = (team.currentPlayerIndex + 1) % team.players.length;

            // Передаем ход следующей команде
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
        }

        function nextTurn() {
            prepareTurn();
        }

        function endGame() {
            const finalScoresDiv = document.getElementById('final-scores');
            finalScoresDiv.innerHTML = '';
            
            // Сортируем команды по убыванию очков
            teams.sort((a, b) => b.score - a.score);

            teams.forEach((t, i) => {
                let div = document.createElement('div');
                div.className = 'team-score';
                div.innerHTML = `<span>${i === 0 ? '🏆 ' : ''}${t.name}</span> <span>${t.score}</span>`;
                finalScoresDiv.appendChild(div);
            });

            showScreen('screen-final');
        }
    </script>
</body>
</html>
